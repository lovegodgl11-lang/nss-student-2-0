    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        :root {
            --bg-primary: #f7f8fa;
            --bg-secondary: #ffffff;
            --text-primary: #1f2937;
            --text-secondary: #6b7280;
            --accent-primary: #16a34a;
            --accent-hover: #15803d;
            --border-color: #e5e7eb;
        }
        html, body { height: 100%; overflow: hidden; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg-primary); }
        .card { 
            background-color: var(--bg-secondary); border-radius: 1rem; padding: 1.5rem;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05), 0 2px 4px -1px rgba(0,0,0,0.05);
        }
        .form-input, .form-textarea {
            width: 100%; padding: 0.75rem; border: 1px solid var(--border-color);
            border-radius: 0.5rem; font-size: 1rem; background-color: var(--bg-secondary);
        }
        
        .sidebar { transition: width 0.3s ease; }
        .sidebar.collapsed { width: 5rem; }
        .sidebar.collapsed .sidebar-header-text, .sidebar.collapsed .nav-text { display: none; }
        .sidebar.collapsed .nav-button { justify-content: center; }

        #bottom-nav { border-top: 1px solid var(--border-color); }
        .bottom-nav-btn { color: var(--text-secondary); }
        .bottom-nav-btn.active { color: var(--accent-primary); }
        .nav-button.active { background-color: #dcfce7; color: var(--accent-primary); }
        
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: rgba(0,0,0,0.5); display: none;
            justify-content: center; align-items: center; z-index: 1000;
        }
        .modal.active { display: flex; }
        .modal-content { background-color: white; padding: 2rem; border-radius: 1rem; width: 90%; max-width: 500px; }

        #chat-modal .modal-content {
            height: 70vh; max-width: 450px; padding: 0; display: flex; flex-direction: column;
        }
        #chat-header { padding: 1rem 1.5rem; border-bottom: 1px solid #e5e7eb; font-weight: 700; }
        #chat-messages { flex-grow: 1; padding: 1.5rem; overflow-y: auto; display: flex; flex-direction: column; }
        .chat-bubble { max-width: 80%; padding: 0.5rem 1rem; border-radius: 1rem; margin-bottom: 0.5rem; }
        .chat-bubble.sent { background-color: var(--accent-primary); color: white; align-self: flex-end; border-bottom-right-radius: 0.25rem; }
        .chat-bubble.received { background-color: #e5e7eb; color: var(--text-primary); align-self: flex-start; border-bottom-left-radius: 0.25rem; }
        #chat-form { padding: 1rem; border-top: 1px solid #e5e7eb; display: flex; gap: 0.5rem; }

        @media (max-width: 767px) {
            .sidebar { display: none; }
            #bottom-nav { display: flex; }
            main { padding-bottom: 5rem; } 
        }
        @media (min-width: 768px) {
            #menu-toggle { display: block; }
            #bottom-nav { display: none; }
        }
    </style>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyD7gB7FbMFtG1k1vJGVI3XVCyCUNeZIC7M",
        databaseURL: "https://smart-school-e9f86-default-rtdb.asia-southeast1.firebasedatabase.app",
    };

    // --- APP STATE ---
    let db;
    let student = null;
    let allStudents = [];
    let allStaff = [];
    let allHomework = [];
    let allResults = [];
    let allLiveClasses = [];
    let allBuses = [];
    let allBusTrips = [];
    let allLeaves = [];
    let activeDBListeners = [];
    let currentChatListener = null;
    let countdownIntervalId = null;
    let currentEtaInfo = null;
    let isCountdownPaused = false;
    let pausedRemainingMs = 0;


    const mainContent = document.getElementById('app-content-container');

    // --- UTILITIES ---
    function showToast(message) {
        const t = document.getElementById('toast');
        if(!t) return;
        t.textContent = message; t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 3000);
    }
    
    function logout() {
        cleanupDBListeners();
        sessionStorage.removeItem('loggedInUser');
        student = null;
        document.getElementById('app-container').classList.add('hidden');
        document.getElementById('login-overlay').classList.remove('hidden');
    }

    function cleanupDBListeners() {
        if (countdownIntervalId) {
            clearInterval(countdownIntervalId);
            countdownIntervalId = null;
            currentEtaInfo = null;
            isCountdownPaused = false;
            pausedRemainingMs = 0;
        }
        activeDBListeners.forEach(l => l.ref.off(l.type, l.callback));
        activeDBListeners = [];
        if (currentChatListener) {
            currentChatListener.ref.off('value', currentChatListener.callback);
            currentChatListener = null;
        }
    }
    function addDBListener(ref, type, callback) {
        ref.on(type, callback);
        activeDBListeners.push({ ref, type, callback });
    }

    function speak(text) {
        if ('speechSynthesis' in window) {
            speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            speechSynthesis.speak(utterance);
        }
    }

    // --- RENDER FUNCTIONS ---
    function renderDashboard() {

        mainContent.innerHTML = `

            </div>
        `;
    }

    function renderIdCard() {
        mainContent.innerHTML = `
            <div class="max-w-sm mx-auto bg-white rounded-2xl shadow-lg overflow-hidden">
                <div class="bg-green-600 p-4 text-center text-white">
                    <h2 class="text-xl font-bold">Navrose Smart School</h2>

                </div>

                    <div id="qrcode" class="flex justify-center p-4 bg-white border rounded-lg mb-4"></div>

        `;
        new QRCode(document.getElementById("qrcode"), { text: student.id, width: 128, height: 128 });
    }
    
    function renderHomework() {
        const myHomework = allHomework
            .filter(h => h.className === student.className && h.section === student.section)
            .sort((a,b) => new Date(b.dueDate) - new Date(a.dueDate));
        
        const homeworkList = myHomework.length > 0 ? myHomework.map(h => `

    function renderTransport() {
        if (!student.transportInfo || !student.transportInfo.busId) {
            mainContent.innerHTML = `<div class="card text-center"><p class="text-gray-600">You are not currently assigned to a bus route. Please contact the transport manager.</p></div>`;
            return;
        }

        mainContent.innerHTML = `
            <div class="card">
                <h3 class="text-xl font-bold mb-4">Live Bus Tracking</h3>
                <div id="transport-status-container" class="space-y-4">
                    <p class="text-center p-8 text-gray-500">Connecting to bus...</p>
                </div>
            </div>
        `;

        const busId = student.transportInfo.busId;
        const bus = allBuses.find(b => b.id === busId);
        
        if (!bus) {
            document.getElementById('transport-status-container').innerHTML = `<p class="text-center p-8 text-red-500">Error: Could not find details for your assigned bus.</p>`;
            return;
        }
        const driverId = bus.assignedDriverId;
        const driver = allStaff.find(s => s.id === driverId);
        
        let liveData = { bus, driver, tripId: null, location: null, boardingInfo: null, etaInfo: null, liveStatus: 'On Way' };
        let innerListeners = [];

        const renderCurrentStatus = () => {
            renderTransportStatus(liveData);
        };

        const cleanupInnerListeners = () => {
            innerListeners.forEach(l => l.ref.off(l.type, l.callback));
            innerListeners = [];
        };

        addDBListener(db.ref(`buses/${busId}/activeTripId`), 'value', tripIdSnap => {
            cleanupInnerListeners();
            if (countdownIntervalId) clearInterval(countdownIntervalId);
            
            const activeTripId = tripIdSnap.val();
            liveData.tripId = activeTripId;
            liveData.location = null;
            liveData.boardingInfo = null;
            liveData.etaInfo = null;
            liveData.liveStatus = 'On Way';

            if (!activeTripId) {
                renderCurrentStatus(); 
                return;
            }

            const locationRef = db.ref(`busLocations/${busId}`);
            const locationCallback = locationSnap => { liveData.location = locationSnap.val(); renderCurrentStatus(); };
            locationRef.on('value', locationCallback);
            innerListeners.push({ ref: locationRef, type: 'value', callback: locationCallback });
            
            const boardingRef = db.ref(`busTrips/${activeTripId}/boardedStudents/${student.id}`);
            const boardingCallback = snapshot => { liveData.boardingInfo = snapshot.val(); renderCurrentStatus(); };
            boardingRef.on('value', boardingCallback);
            innerListeners.push({ ref: boardingRef, type: 'value', callback: boardingCallback });

            const etaRef = db.ref(`busTrips/${activeTripId}/studentETAs/${student.id}`);
            const etaCallback = snapshot => { liveData.etaInfo = snapshot.val(); renderCurrentStatus(); };
            etaRef.on('value', etaCallback);
            innerListeners.push({ ref: etaRef, type: 'value', callback: etaCallback });

            const statusRef = db.ref(`busTrips/${activeTripId}/liveStatus`);
            const statusCallback = snapshot => { liveData.liveStatus = snapshot.val() || 'On Way'; renderCurrentStatus(); };
            statusRef.on('value', statusCallback);
            innerListeners.push({ ref: statusRef, type: 'value', callback: statusCallback });


            const announcementRef = db.ref(`busAnnouncements/${activeTripId}`);
            const announcementCallback = snapshot => {
                const announcement = snapshot.val();
                if (announcement && announcement.message) {
                    showToast(`Bus Announcement: ${announcement.message}`);
                    if (announcement.voice && 'speechSynthesis' in window) {
                        speak(announcement.message);
                    }
                }
            };
            announcementRef.limitToLast(1).on('child_added', announcementCallback);
            innerListeners.push({ ref: announcementRef, type: 'child_added', callback: announcementCallback });
        });
    }

    function renderTransportStatus({ bus, tripId, location, boardingInfo, driver, etaInfo, liveStatus }) {
        const container = document.getElementById('transport-status-container');
        if (!container) return;
    
        const boardedStatus = boardingInfo ? 
            `<p class="text-2xl font-bold text-green-700">Boarded</p><p class="text-green-600">You are on the bus.</p>` :
            `<p class="text-2xl font-bold text-yellow-700">Not Boarded</p><p class="text-yellow-600">Waiting for pickup.</p>`;
    
        const commsHTML = driver ? `<div class="mt-6 flex flex-col md:flex-row gap-4 justify-center">
            <button onclick="openChatWithDriver('${driver.id}', '${driver.staffName}')" class="py-3 px-6 bg-blue-600 text-white font-semibold rounded-lg hover:bg-blue-700">Message Driver</button>
            <button onclick="callDriver('${driver.id}', '${driver.staffName}')" class="py-3 px-6 bg-green-600 text-white font-semibold rounded-lg hover:bg-green-700">Call Driver</button>
        </div>` : '';
    
        container.innerHTML = `
            <p class="text-lg font-semibold">Bus: ${bus.busNumber}</p>
            <p class="text-lg font-semibold">Your Stop: ${student.transportInfo.stopName}</p>
            <div id="live-status-section" class="mt-4 p-4 bg-blue-50 border-blue-200 rounded-lg text-center">
                 <p class="text-lg">Bus Status: <span id="live-bus-status" class="font-bold">${liveStatus}</span></p>
            </div>
            <div id="eta-section" class="mt-4"></div>
            <div class="mt-4 p-4 bg-green-50 border-green-200 rounded-lg text-center">
                ${boardedStatus}
            </div>
            ${commsHTML}
        `;
    
        const etaContainer = document.getElementById('eta-section');
    
        if (etaInfo && (!currentEtaInfo || etaInfo.setAt !== currentEtaInfo.setAt)) {
            currentEtaInfo = etaInfo;
            if (countdownIntervalId) clearInterval(countdownIntervalId);
            isCountdownPaused = false;
    
            const targetTime = etaInfo.setAt + (etaInfo.eta * 60 * 1000);
            const initialTotalSeconds = etaInfo.eta * 60;
            let notificationState = { firstWarning: false, finalWarning: false };
    
            etaContainer.innerHTML = `
                <div id="countdown-display" class="p-4 rounded-lg text-white text-center transition-colors duration-500">
                    <p class="text-sm uppercase tracking-wider">Bus Arriving In</p>
                    <p id="countdown-timer" class="text-5xl font-extrabold tracking-tight">--:--</p>
                </div>
            `;
            
            const timerEl = document.getElementById('countdown-timer');
            const displayEl = document.getElementById('countdown-display');
    
            const updateCountdown = () => {
                if (!timerEl || !displayEl || isCountdownPaused) {
                    if(isCountdownPaused) {
                        timerEl.innerHTML = timerEl.textContent.split(' ')[0] + ' ⏸️';
                    }
                    clearInterval(countdownIntervalId);
                    return;
                }
                const remainingMs = targetTime - Date.now();
                if (remainingMs <= 0) {
                    clearInterval(countdownIntervalId);
                    countdownIntervalId = null;
                    currentEtaInfo = null;
                    displayEl.innerHTML = `<p class="text-2xl font-bold">Bus should have arrived!</p>`;
                    displayEl.classList.remove('bg-red-500', 'bg-yellow-500');
                    displayEl.classList.add('bg-green-500');
                    return;
                }
    
                const remainingSeconds = Math.round(remainingMs / 1000);
                const minutes = Math.floor(remainingSeconds / 60);
                const seconds = remainingSeconds % 60;
                timerEl.textContent = `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
                
                const timeRatio = remainingSeconds / initialTotalSeconds;
                displayEl.classList.remove('bg-red-500', 'bg-yellow-500', 'bg-green-500');
                if (timeRatio > 2/3) displayEl.classList.add('bg-red-500');
                else if (timeRatio > 1/3) displayEl.classList.add('bg-yellow-500');
                else displayEl.classList.add('bg-green-500');
    
                const firstWarningThreshold = initialTotalSeconds * (2/3);
                const finalWarningThreshold = 120;
    
                if (remainingSeconds <= finalWarningThreshold && !notificationState.finalWarning) {
                    speak(`${student.studentName}, the bus is about to arrive, please come now.`);
                    notificationState.finalWarning = true;
                } else if (remainingSeconds <= firstWarningThreshold && !notificationState.firstWarning) {
                    speak(`${student.studentName}, hurry up, the bus is coming to pick you up.`);
                    notificationState.firstWarning = true;
                }
            };
    
            if (liveStatus === 'On Way') {
                countdownIntervalId = setInterval(updateCountdown, 1000);
                updateCountdown();
            } else {
                 updateCountdown(); // run once to display time
                 if (timerEl) timerEl.innerHTML += ' ⏸️';
            }
    
        } else if (!etaInfo && !currentEtaInfo) {
            if (countdownIntervalId) clearInterval(countdownIntervalId);
            
            let liveStatusHTML = `<p class="text-2xl font-bold text-gray-700">Connecting...</p>`;
            if (tripId) {
                 liveStatusHTML = `<p class="text-2xl font-bold text-blue-700">Bus is on the way!</p>
                    ${location ? `<p class="text-gray-500">Last updated: ${new Date(location.timestamp).toLocaleTimeString()}</p>` : ''}`;
            } else {
                liveStatusHTML = `<p class="text-2xl font-bold text-gray-700">Trip Not Active</p>`;
            }
            etaContainer.innerHTML = `<div class="p-4 bg-gray-100 rounded-lg text-center">${liveStatusHTML}</div>`;
        }
        
        // Handle pause and resume based on liveStatus
        if (liveStatus === 'Stopped in Traffic' && countdownIntervalId && !isCountdownPaused) {
            const targetTime = currentEtaInfo.setAt + (currentEtaInfo.eta * 60 * 1000);
            pausedRemainingMs = targetTime - Date.now();
            clearInterval(countdownIntervalId);
            countdownIntervalId = null;
            isCountdownPaused = true;
            const timerEl = document.getElementById('countdown-timer');
            if (timerEl) timerEl.innerHTML += ' ⏸️';
        } else if (liveStatus === 'On Way' && isCountdownPaused) {
            isCountdownPaused = false;
            if (currentEtaInfo) {
                // To restart, we trick the logic into thinking it's a new ETA
                const newEtaInfo = { ...currentEtaInfo, setAt: Date.now() };
                const remainingMinutes = Math.max(0, pausedRemainingMs / (60 * 1000));
                newEtaInfo.eta = remainingMinutes;
                currentEtaInfo = null; // Force re-initialization
                renderTransportStatus({bus, tripId, location, boardingInfo, driver, etaInfo: newEtaInfo, liveStatus});
            }
        }
    }

    function renderLeaveApplication() { 
        const myLeaves = allLeaves.filter(l => l.applicantId === student.id).sort((a,b) => new Date(b.submittedAt) - new Date(a.submittedAt));
        const getStatusBadge = (status) => {

            if (status === 'Rejected') return `<span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-red-100 text-red-800">${status}</span>`;
            return `<span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full bg-yellow-100 text-yellow-800">${status}</span>`;
        };

        mainContent.innerHTML = `
            <div class="card">
                <div class="flex justify-between items-center mb-6">
                    <h3 class="text-xl font-bold">My Leave Applications</h3>

                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left">
                        <thead><tr class="border-b"><th class="p-3">Dates</th><th class="p-3">Reason</th><th class="p-3">Status</th></tr></thead>

                                <td class="p-3">${leave.reason}</td>
                                <td class="p-3">${getStatusBadge(leave.status)}</td>
                            </tr>`).join('') : `<tr><td colspan="3" class="text-center p-8 text-gray-500">No leave applications found.</td></tr>`}
                        </tbody>
                    </table>
                </div>
            </div>`;
        
        document.getElementById('apply-leave-btn').addEventListener('click', () => {
             const modal = document.createElement('div');
            modal.className = 'modal active';
            modal.innerHTML = `
                <div class="modal-content">
                    <h3 class="text-xl font-bold mb-4">New Leave Application</h3>
                    <form id="leave-form" class="space-y-4">
                        <div class="grid grid-cols-2 gap-4">
                            <div><label>Start Date</label><input type="date" id="start-date" class="form-input mt-1" required></div>
                            <div><label>End Date</label><input type="date" id="end-date" class="form-input mt-1" required></div>
                        </div>
                        <div><label>Reason</label><textarea id="reason" class="form-textarea mt-1" rows="4" required></textarea></div>

                            <button type="button" class="px-4 py-2 bg-gray-200 text-gray-800 font-semibold rounded-lg" onclick="this.closest('.modal').remove()">Cancel</button>
                            <button type="submit" class="px-4 py-2 bg-green-600 text-white font-semibold rounded-lg">Submit</button>

            document.body.appendChild(modal);

                e.preventDefault();

                    id: leaveId, applicantId: student.id, applicantName: student.studentName,
                    applicantType: 'student',
                    startDate: document.getElementById('start-date').value,
                    endDate: document.getElementById('end-date').value,

                    status: 'Pending', submittedAt: new Date().toISOString()
                };

    // --- CHAT & CALL ---
    function callDriver(driverId, driverName) {
        const modal = document.getElementById('call-modal');
        document.getElementById('call-modal-title').textContent = `Calling ${driverName}...`;
        modal.classList.add('active');
    }

    const chatCallback = (snapshot) => {
        const messagesContainer = document.getElementById('chat-messages');
        if (!messagesContainer) return;
        const messages = Object.values(snapshot.val() || {}).sort((a, b) => a.timestamp - b.timestamp);
        messagesContainer.innerHTML = messages.map(msg => `<div class="chat-bubble ${msg.senderId === student.id ? 'sent' : 'received'}">${msg.text}</div>`).join('');
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    };
    
    function openChatWithDriver(driverId, driverName) {
        const modal = document.getElementById('chat-modal');
        document.getElementById('chat-header-title').textContent = `Chat with Driver (${driverName})`;
        document.getElementById('chat-messages').innerHTML = '';
        modal.classList.add('active');
        
        const chatId = `${driverId}_${student.id}`;
        const chatRef = db.ref(`chats/${chatId}`);
        if (currentChatListener) currentChatListener.ref.off('value', currentChatListener.callback);
        
        chatRef.on('value', chatCallback);
        currentChatListener = { ref: chatRef, callback: chatCallback };

        const chatForm = document.getElementById('chat-form');
        const newForm = chatForm.cloneNode(true);
        chatForm.parentNode.replaceChild(newForm, chatForm);

        newForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;

            const message = { senderId: student.id, receiverId: driverId, text, timestamp: Date.now() };
            await chatRef.push(message);
            input.value = '';
        });
    }

    // --- APP FLOW & NAVIGATION ---
    const tabs = {
        dashboard: { render: renderDashboard, title: "Dashboard" },
        'id-card': { render: renderIdCard, title: "My ID Card" },
        homework: { render: renderHomework, title: "Homework" },
        liveclass: { render: renderLiveClass, title: "Live Class" },
        transport: { render: renderTransport, title: "Transport" },
        results: { render: renderResults, title: "Results" },
        'leave-application': { render: renderLeaveApplication, title: "Leave Application" },
        'my-profile': { render: renderMyProfile, title: "My Profile" },
    };

    function setActiveTab(tabName) {
        cleanupDBListeners();
        document.getElementById('page-title').textContent = tabs[tabName]?.title || "Student Portal";
        
        document.querySelectorAll('.sidebar .nav-button').forEach(b => b.classList.toggle('active', b.dataset.tab === tabName));
        document.querySelectorAll('#bottom-nav button').forEach(b => b.classList.toggle('active', b.dataset.tab === tabName));

        const renderFunction = tabs[tabName]?.render;
        if(renderFunction) {
            renderFunction();
        } else {
            mainContent.innerHTML = `<div class="card text-center">This feature is under development.</div>`;
        }
    }

    async function runApp(loggedInUser) {
        document.getElementById('login-overlay').classList.add('hidden');
        document.getElementById('app-container').classList.remove('hidden');
        mainContent.innerHTML = `<div class="text-center p-8">Loading your portal...</div>`;

        try {
            const [studentsSnap, homeworkSnap, resultsSnap, liveClassesSnap, busesSnap, busTripsSnap, leavesSnap, staffSnap] = await Promise.all([
                db.ref('students').once('value'),
                db.ref('homework').once('value'),
                db.ref('results').once('value'),
                db.ref('liveClasses').once('value'),
                db.ref('buses').once('value'),
                db.ref('busTrips').once('value'),
                db.ref('leaves').once('value'),
                db.ref('staff').once('value'),
            ]);
            
            allStudents = Object.values(studentsSnap.val() || {});
            allStaff = Object.values(staffSnap.val() || {});
            allHomework = Object.values(homeworkSnap.val() || {});
            allResults = Object.values(resultsSnap.val() || {});
            allLiveClasses = Object.values(liveClassesSnap.val() || {});
            allBuses = Object.values(busesSnap.val() || {});
            allBusTrips = Object.values(busTripsSnap.val() || {});
            allLeaves = Object.values(leavesSnap.val() || {});

            student = allStudents.find(s => s && s.id === loggedInUser.id);
            if (!student) {
                logout();
                throw new Error('Student profile not found.');
            }
            
            document.getElementById('student-info').innerHTML = `<p class="font-semibold">${student.studentName}</p><p class="text-sm text-gray-500">${student.className}-${student.section}</p>`;
            
            document.querySelectorAll('.nav-button, .bottom-nav-btn').forEach(btn => {
                btn.addEventListener('click', () => setActiveTab(btn.dataset.tab));
            });

            setActiveTab('dashboard');

        } catch (error) {
            console.error("Failed to load student data:", error);
            mainContent.innerHTML = `<div class="card text-red-700 bg-red-100"><h3 class="font-bold">Error</h3><p>Could not load your data. Please log out and try again.</p></div>`;
        }
    }
    
    // --- INITIALIZATION ---
    document.addEventListener('DOMContentLoaded', () => {
        if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
        db = firebase.database();

        const form = document.getElementById('student-login-form');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const admissionNo = document.getElementById('student-admission-no').value;
            const mobile = document.getElementById('student-mobile').value;
            const button = form.querySelector('button[type="submit"]');
            button.disabled = true; button.textContent = 'Verifying...';
            
            try {
                const snapshot = await db.ref('students').orderByChild('admissionNumber').equalTo(admissionNo).once('value');
                if (snapshot.exists()) {
                    const studentData = snapshot.val();
                    const foundStudent = Object.values(studentData).find(s => s.mobile === mobile);
                    
                    if (foundStudent) {
                        const user = { role: 'student', id: foundStudent.id };
                        sessionStorage.setItem('loggedInUser', JSON.stringify(user));
                        runApp(user);
                    } else {
                        showToast('Mobile number does not match admission number.');
                    }
                } else {
                    showToast('Admission number not found.');
                }
            } catch (err) {
                showToast('Login failed. Check your connection.');
                console.error(err);
            } finally {
                button.disabled = false; button.textContent = 'Login';
            }
        });
        
        document.getElementById('logout-btn').addEventListener('click', logout);

        let loggedInUser = null;
        try {
            const userData = sessionStorage.getItem('loggedInUser');
            if (userData) loggedInUser = JSON.parse(userData);
        } catch (e) {
            sessionStorage.removeItem('loggedInUser');
        }
        
        if (loggedInUser && loggedInUser.role === 'student') {
            runApp(loggedInUser);
        }
    });

</script>
